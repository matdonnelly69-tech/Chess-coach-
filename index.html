<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pocket Chess Coach</title>
  
  <!-- Chessground Styles (Mobile Sized) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.base.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.brown.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.cburnett.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chessground@9.1.1/chessground.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121214;
      color: #f4f4f5;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .header { width: 100%; max-width: 400px; display: flex; gap: 8px; }
    input, select {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      width: 100%;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; }
    
    /* Responsive square board fitting mobile screen */
    #board-container {
      width: 92vw;
      height: 92vw;
      max-width: 380px;
      max-height: 380px;
    }

    .nav-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .nav-bar button { flex: 1; padding: 12px; }
    #move-indicator { font-size: 13px; color: #a1a1aa; font-weight: 500; min-width: 90px; text-align: center; }

    .card {
      width: 100%;
      max-width: 400px;
      background: #1f1f23;
      border: 1px solid #333338;
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .badge-coach { background: #3b82f6; color: white; }
    #coach-text { white-space: pre-wrap; color: #e4e4e7; }
  </style>
</head>
